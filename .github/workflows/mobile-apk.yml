name: Apex360 Android test APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android platform scaffold
        working-directory: mobile_app
        run: flutter create --platforms=android --project-name=taranom_hamdeli --org=ir.taranomhamdeli .
      - name: Remove generated example test
        working-directory: mobile_app
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: mobile_app
        run: flutter analyze --no-fatal-infos
      - name: Build installable test APK
        working-directory: mobile_app
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apex360-android-test-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
