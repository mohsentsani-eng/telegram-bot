name: Apex360 Android test APK

on:
  push:
    branches: [feature/mobile-app-foundation]
    paths:
      - 'mobile_app/**'
      - 'app/mobile_api.py'
      - 'app/admin.py'
      - 'app/db.py'
      - 'app/migrations.py'
      - 'app/counselor_portal.py'
      - 'tools/*mobile*.py'
      - 'tests/test_mobile_auth.py'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    if: github.ref == 'refs/heads/feature/mobile-app-foundation'
    environment:
      name: apex360-android-signing
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android platform scaffold
        working-directory: mobile_app
        run: flutter create --platforms=android --project-name=taranom_hamdeli --org=ir.taranomhamdeli .
      - name: Allow the loopback API in demo builds
        if: vars.APEX360_TEST_API_ORIGIN == ''
        working-directory: mobile_app
        run: python3 ../tools/configure_mobile_debug.py
      - name: Remove generated example test
        working-directory: mobile_app
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: mobile_app
        run: flutter analyze --no-fatal-infos
      - name: Test the offline app
        working-directory: mobile_app
        run: flutter test --dart-define=API_BASE_URL=https://apex.test
      - name: Test the isolated mobile API
        run: |
          python3 -m pip install 'fastapi>=0.115' uvicorn pytest httpx python-multipart itsdangerous
          python3 -m pytest -q tests/test_mobile_auth.py
      - name: Configure stable debug signing
        env:
          APEX_KEYSTORE: ${{ secrets.APEX360_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$APEX_KEYSTORE" ]; then
            echo "::error::APEX360_DEBUG_KEYSTORE_BASE64 is required for signing."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$APEX_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/apex360-signer.der"
      - name: Build installable APK
        working-directory: mobile_app
        env:
          APEX_API_ORIGIN: ${{ vars.APEX360_TEST_API_ORIGIN }}
        run: |
          if [ -z "$APEX_API_ORIGIN" ]; then
            flutter build apk --debug --dart-define=APEX_LOCAL_TEST=true
          else
            python3 -c 'import os, re, sys; sys.exit(0 if re.fullmatch(r"https://[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)+/?", os.environ["APEX_API_ORIGIN"]) else "Expected an HTTPS origin without a path or credentials")'
            flutter build apk --debug --dart-define="API_BASE_URL=$APEX_API_ORIGIN"
          fi
      - name: Verify APK identity and version
        working-directory: mobile_app
        run: |
          AAPT="$(find "${ANDROID_HOME}/build-tools" -name aapt -type f | sort -V | tail -1)"
          metadata="$("$AAPT" dump badging build/app/outputs/flutter-apk/app-debug.apk)"
          grep -F "package: name='ir.taranomhamdeli.taranom_hamdeli' versionCode='45' versionName='0.17.0'" <<< "$metadata"
      - name: Verify APK signature
        working-directory: mobile_app
        env:
          # Public certificate digest from the 0.12.0 APK (Actions run 45805205510).
          APEX_V12_CERT_SHA256: 9ac7005abeb102c31933cca8a56e05e66e486b8bf1c1ba38ae43f733a2d44527
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          signature="$("$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-debug.apk)"
          printf '%s\n' "$signature"
          expected="$(sha256sum "$RUNNER_TEMP/apex360-signer.der" | cut -d ' ' -f 1)"
          actual="$(printf '%s\n' "$signature" | sed -nE 's/^.*Signer.*certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p' | tr '[:upper:]' '[:lower:]' | sort -u)"
          if ! printf '%s\n' "$signature" | grep -Fxq 'Number of signers: 1' || [ "$actual" != "$expected" ] || [ "$actual" != "$APEX_V12_CERT_SHA256" ]; then
            echo "::error::APK signer does not match the configured Apex360 certificate and the published v12 APK."
            exit 1
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$HOME/.android/debug.keystore" "$RUNNER_TEMP/apex360-signer.der"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apex360-android-${{ vars.APEX360_TEST_API_ORIGIN != '' && 'https-test' || 'conference-demo' }}
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
