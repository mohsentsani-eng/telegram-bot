name: Apex360 Android test APK

on:
  push:
    branches: [feature/mobile-app-foundation]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    if: github.ref == 'refs/heads/feature/mobile-app-foundation'
    environment:
      name: apex360-android-signing
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android platform scaffold
        working-directory: mobile_app
        run: flutter create --platforms=android --project-name=taranom_hamdeli --org=ir.taranomhamdeli .
      - name: Remove generated example test
        working-directory: mobile_app
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: mobile_app
        run: flutter analyze --no-fatal-infos
      - name: Configure stable debug signing
        env:
          APEX_KEYSTORE: ${{ secrets.APEX360_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$APEX_KEYSTORE" ]; then
            echo "::error::APEX360_DEBUG_KEYSTORE_BASE64 is required for signing."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$APEX_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/apex360-signer.der"
      - name: Build installable test APK
        working-directory: mobile_app
        run: flutter build apk --debug --build-name=0.12.0 --build-number="${{ github.run_number }}" --dart-define=APEX_DEMO_MODE=true
      - name: Verify APK signature
        working-directory: mobile_app
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          signature="$("$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-debug.apk)"
          printf '%s\n' "$signature"
          expected="$(sha256sum "$RUNNER_TEMP/apex360-signer.der" | cut -d ' ' -f 1)"
          actual="$(printf '%s\n' "$signature" | sed -nE 's/^.*Signer.*certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p' | tr '[:upper:]' '[:lower:]' | sort -u)"
          if ! printf '%s\n' "$signature" | grep -Fxq 'Number of signers: 1' || [ "$actual" != "$expected" ]; then
            echo "::error::APK signer does not match the configured Apex360 certificate."
            exit 1
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$HOME/.android/debug.keystore" "$RUNNER_TEMP/apex360-signer.der"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apex360-android-test-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
